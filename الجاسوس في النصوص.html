function opts(o,k){return `<div>${o.map(([t,c])=>`<button class="o" data-k="${c?1:0}" data-a="ch" data-ok="${c?1:0}">${t}</button>`).join("")}</div>`}
function exams(){document.documentElement.style.setProperty("--c","#5b4bdb");m.innerHTML=`<div class="sec">اختر النموذج (25 سؤالًا)</div><div class="card">⚠️ مدة الاختبار 30 دقيقة. بمجرد بدء النموذج لا يمكنك العودة للمحتوى أو مغادرة الاختبار حتى التسليم أو انتهاء الوقت، وتظهر النتيجة والإجابات الصحيحة بعد التسليم.</div><div class="nv" style="justify-content:center">${[1,2,3].map(i=>`<button class="btn" data-a="ex" data-v="${i-1}">نموذج ${i}</button>`).join("")}</div>`}
function ex(k,end){clearInterval(tm);live={k,end:end||Date.now()+1800000};try{localStorage.setItem("xs",JSON.stringify(live))}catch(e){}window.onbeforeunload=()=>"";tm=setInterval(upd,1000);tabs();let h=`<div class="sc" id="sc"></div><div class="sec">نموذج ${k+1} – اختر (10)</div>`,n=1;
for(let i=0;i<10;i++){const q=M[k*10+i],c=+q[5];h+=`<div class="card"><div class="q">${n++}. ${q[0]}</div>${opts([1,2,3,4].map(j=>[q[j],j-1==c]))}</div>`}
h+=`<div class="sec">صح أم خطأ (5)</div>`;for(let i=0;i<5;i++){const q=TF[k*5+i];h+=`<div class="card"><div class="q">${n++}. ${q[0]}</div>${opts([["True",q[1]==1],["False",q[1]==0]])}</div>`}
const tr=(i,ea)=>{const a=G[i%30],o=[a,G[(i+7)%30],G[(i+13)%30],G[(i+19)%30]],s=(k+i)%4;[o[0],o[s]]=[o[s],o[0]];return opts(o.map(x=>[x[ea?1:0],x==a]))};
h+=`<div class="sec">ترجمة: English → عربي (5)</div>`;for(let i=0;i<5;i++){const a=G[k*10+i];h+=`<div class="card"><div class="q">${n++}. ${a[0]}</div>${tr(k*10+i,1)}</div>`}
h+=`<div class="sec">ترجمة: عربي → English (5)</div>`;for(let i=5;i<10;i++){const a=G[k*10+i];h+=`<div class="card"><div class="q" style="direction:rtl;text-align:right">${n++}. ${a[1]}</div>${tr(k*10+i,0)}</div>`}
m.innerHTML=h+`<div class="nv" id="endnav"></div>`;upd()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||b.disabled)return;const a=b.dataset.a,v=b.dataset.v,n=+v;if(live&&a!="ch"&&a!="fin")return;
if(a=="tab"){tab=n;part=0;go();return}
if(a=="part"){part=n;sum()}else if(a=="prev"){part--;sum()}else if(a=="next"){part++;sum()}else if(a=="toqa"){tab=1;go();return}
else if(a=="rev"){rev(v);return}else if(a=="ch"){ch(b);return}else if(a=="fin"){fin();return}
else if(a=="ex"){ex(n)}else if(a=="exams"){exams()}
scrollTo(0,0)});
go();try{const s=JSON.parse(localStorage.getItem("xs")||"null");if(s&&s.end>Date.now()){tab=3;ex(s.k,s.end)}else localStorage.removeItem("xs")}catch(e){}
</script></body></html>
